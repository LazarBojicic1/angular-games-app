<form class="search-bar" #searchForm="ngForm" (ngSubmit)="submitSearch()" novalidate>
  <label for="game-search">Search games</label>

  <div class="search-control">
    <input
      id="game-search"
      type="search"
      name="searchText"
      [(ngModel)]="searchText"
      #searchInput="ngModel"
      minlength="2"
      maxlength="80"
      placeholder="Search by title"
      aria-describedby="game-search-error"
    />

    <button type="submit" [disabled]="searchForm.invalid">Search</button>
    <button class="ghost" type="button" (click)="clearSearch()">Clear</button>
  </div>

  <p id="game-search-error" class="field-error" *ngIf="searchInput.touched && searchInput.errors?.['minlength']">
    Enter at least 2 characters, or clear the field to show all games.
  </p>
</form>
