<main class="page-shell">
  <header class="page-header">
    <p>Genres</p>
    <h1>Browse the catalog by play style.</h1>
    <span>Choose a genre to explore matching games.</span>
  </header>

  <app-loading-spinner *ngIf="isLoading" label="Loading genres"></app-loading-spinner>

  <app-error-message
    *ngIf="!isLoading && hasError"
    title="We couldn't load genres"
    message="Please try again in a moment."
    (retry)="loadGenres()"
  ></app-error-message>

  <section class="genre-grid" *ngIf="!isLoading && !hasError">
    <article class="genre-card" *ngFor="let genre of genres">
      <img [src]="genre.image_background || '/images/hero-bg.avif'" [alt]="genre.name" loading="lazy" />

      <div>
        <span>{{ genre.games_count | number }} games</span>
        <h2>{{ genre.name }}</h2>
        <a [routerLink]="['/genres', genre.id]">View games</a>
      </div>
    </article>
  </section>
</main>
