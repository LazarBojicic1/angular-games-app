<main class="page-shell">
  <header class="page-header">
    <p>Library</p>
    <h1>Favorites</h1>
    <span>Your strongest picks, securely saved to your account.</span>
  </header>

  <app-loading-spinner *ngIf="isLoading" label="Loading favorites"></app-loading-spinner>

  <app-error-message
    *ngIf="!isLoading && hasError"
    title="We couldn't load your favorites"
    message="Please try again in a moment."
    (retry)="refreshFavorites()"
  ></app-error-message>

  <section *ngIf="!isLoading && !hasError && favorites.length; else emptyState">
    <div class="content-meta">
      <span><strong>{{ favorites.length }}</strong> favorite games</span>
      <a class="secondary-action" routerLink="/games">Browse catalog</a>
    </div>

    <div class="games-grid">
      <app-game-card
        *ngFor="let game of favorites"
        [game]="game"
        (libraryChange)="refreshFavorites()"
      ></app-game-card>
    </div>
  </section>

  <ng-template #emptyState>
    <div class="empty-state" *ngIf="!isLoading && !hasError">
      <h2>No favorites yet</h2>
      <p>Explore the catalog and mark games you want to keep close.</p>
      <a class="primary-action" routerLink="/games">Browse games</a>
    </div>
  </ng-template>
</main>
